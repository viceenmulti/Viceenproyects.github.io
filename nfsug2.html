<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Need for Speed: Underground 2 - Viceen Projects</title>

<style>
body{
    margin:0;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background:url("img/Fondo.jpg") no-repeat center center fixed;
    background-size:cover;
    color:white;
}

/* capa oscura encima del fondo */
body::before{
    content:"";
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.55);
    backdrop-filter: blur(6px);
    z-index:-1;
}

.container{
    max-width:800px;
    margin:60px auto;
    padding:30px;
    border-radius:16px;
    background:rgba(255,255,255,0.08);
    box-shadow:0 0 25px rgba(0,0,0,0.6);
    text-align:center;
    animation:fade 1s ease;
}

@keyframes fade{
    from{opacity:0; transform:translateY(20px)}
    to{opacity:1; transform:translateY(0)}
}

h1{
    font-size:36px;
    margin-bottom:25px;
    letter-spacing:1px;
}

img{
    max-width:100%;
    border-radius:12px;
    margin-bottom:25px;
    box-shadow:0 0 20px rgba(0,0,0,0.7);
    transition:.4s;
}

img:hover{
    transform:scale(1.03);
}

.info{
    font-size:19px;
    line-height:1.5;
    margin-bottom:35px;
}

/* BOTONES */
.button{
    display:inline-block;
    text-decoration:none;
    color:white;
    padding:14px 30px;
    margin:10px;
    border-radius:8px;
    font-weight:bold;
    letter-spacing:.5px;
    background:linear-gradient(45deg,#555,#777);
    transition:.3s;
}

.button:hover{
    background:linear-gradient(45deg,#777,#999);
    transform:scale(1.07);
    box-shadow:0 0 15px rgba(255,255,255,0.3);
}

/* responsive */
@media(max-width:600px){
    .container{
        margin:30px 15px;
        padding:20px;
    }
    h1{
        font-size:26px;
    }
    .info{
        font-size:16px;
    }
}
</style>
</head>

<body>

<div class="container">

<h1>Need for Speed: Underground 2</h1>

<img src="img/needforspeed.jpg" alt="Need for Speed Underground 2">

<div class="info">
    El legendario juego de carreras callejeras y tuning. Explorá la ciudad de Bayview, personalizá tu auto hasta el más mínimo detalle y competí en distintas modalidades de carrera.
</div>

<a class="button" href="https://www.mediafire.com/file/3ob6uksp58dnrfb/NFSU1_-_NFgames.rar/file" target="_blank">
Descargar
</a>

<br>

<a class="button" href="index.html">Volver a inicio</a>

</div>

</body>
</html>
