<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Fernanfloo Rescatar a Curly - Viceen Projects</title>

<!-- Cargador oficial del emulador Ruffle Flash -->
<script src="https://unpkg.com/@ruffle-rs/ruffle"></script>

<style>
body{
    margin:0;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background:url("img/Fondo.jpg") no-repeat center center fixed;
    background-size:cover;
    color:white;
}

/* capa oscura encima del fondo */
body::before{
    content:"";
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.55);
    backdrop-filter: blur(6px);
    z-index:-1;
}

.container{
    max-width:800px;
    margin:60px auto;
    padding:30px;
    border-radius:16px;
    background:rgba(255,255,255,0.08);
    box-shadow:0 0 25px rgba(0,0,0,0.6);
    text-align:center;
    animation:fade 1s ease;
}

@keyframes fade{
    from{opacity:0; transform:translateY(20px)}
    to{opacity:1; transform:translateY(0)}
}

h1{
    font-size:40px;
    margin-bottom:25px;
    letter-spacing:1px;
}

.info{
    font-size:19px;
    line-height:1.5;
    margin-bottom:25px;
}

/* Contenedor del reproductor Flash/Ruffle */
.game-container{
    width:100%;
    max-width:700px;
    height:500px;
    margin:0 auto 25px auto;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 0 20px rgba(0,0,0,0.7);
    background:#000;
}

.game-container embed{
    width:100%;
    height:100%;
}

/* BOTONES */
.button{
    display:inline-block;
    text-decoration:none;
    color:white;
    padding:14px 30px;
    margin:10px;
    border-radius:8px;
    font-weight:bold;
    letter-spacing:.5px;
    background:linear-gradient(45deg,#555,#777);
    transition:.3s;
}

.button:hover{
    background:linear-gradient(45deg,#777,#999);
    transform:scale(1.07);
    box-shadow:0 0 15px rgba(255,255,255,0.3);
}

/* responsive */
@media(max-width:600px){
    .container{
        margin:30px 15px;
        padding:20px;
    }
    h1{
        font-size:28px;
    }
    .info{
        font-size:16px;
    }
    .game-container{
        height:350px;
    }
}
</style>
</head>

<body>

<div class="container">

<h1>Fernanfloo Rescatar a Curly</h1>

<!-- Área de juego emulado con Ruffle -->
<div class="game-container">
    <embed src="juegos/Fernanfloo Saw Game.swf" type="application/x-shockwave-flash">
</div>

<div class="info">
    ¡Jugá directamente desde la página a Fernanfloo Rescatar a Curly gracias al emulador Ruffle!
</div>

<a class="button" href="index.html">Volver a inicio</a>

</div>

</body>
</html>
