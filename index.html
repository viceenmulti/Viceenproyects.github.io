<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Viceen Projects</title>

<style>
body{
    margin:0;
    font-family:system-ui, sans-serif;
    color:#eaeaea;
    text-align:center;

    /* fondo */
    background:url("img/Fondo.jpg") no-repeat center center fixed;
    background-size:cover;
}

/* capa oscura + blur encima del fondo */
body::before{
    content:"";
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.55);
    backdrop-filter:blur(6px);
    z-index:-1;
}

.container{
    margin-top:50px;
    margin-bottom:60px;
}

h1{
    font-size:36px;
    margin-bottom:20px;
    letter-spacing:1px;
}

/* Subtítulos de categorías */
h2{
    font-size:22px;
    color:#ccc;
    margin-top:40px;
    margin-bottom:20px;
    text-transform:uppercase;
    letter-spacing:1.5px;
    border-bottom:1px solid rgba(255,255,255,0.15);
    display:inline-block;
    padding-bottom:6px;
}

/* LISTA DE ELEMENTOS (JUEGOS Y APPS) */
.item{
    display:flex;
    align-items:center;
    justify-content:left;
    margin:15px auto;
    width:600px;
    background:#151515;
    border-radius:10px;
    padding:10px;
    transition:.2s;
    text-decoration:none;
}

.item:hover{
    background:#1f1f1f;
    transform:translateY(-2px);
}

.item img{
    width:220px;
    height:70px;
    object-fit:cover;
    border-radius:6px;
    margin-right:15px;
}

.item span{
    color:#eaeaea;
    font-size:20px;
    font-weight:500;
}

/* responsive */
@media(max-width:650px){
    .item{
        width:90%;
        flex-direction:column;
        text-align:center;
    }
    .item img{
        margin-right:0;
        margin-bottom:10px;
        width:100%;
        height:120px;
    }
}
</style>
</head>

<body>

<div class="container">
