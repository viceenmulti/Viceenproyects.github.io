<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Viceen Projects</title>

<style>
body{
    margin:0;
    font-family:system-ui, sans-serif;
    color:#eaeaea;
    text-align:center;

    /* fondo */
    background:url("img/Fondo.jpg") no-repeat center center fixed;
    background-size:cover;
}

/* capa oscura + blur encima del fondo */
body::before{
    content:"";
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.55);
    backdrop-filter:blur(6px);
    z-index:-1;
}

.container{
    margin-top:60px;
    margin-bottom:60px;
}

h1{
    margin-bottom:30px;
}

/* Subtítulos de categorías */
h2{
    font-size:22px;
    color:#aaa;
    margin-top:40px;
    margin-bottom:15px;
    text-transform:uppercase;
    letter-spacing:1px;
    border-bottom:1px solid rgba(255,255,255,0.1);
    display:inline-block;
    padding-bottom:5px;
}

/* LISTA DE JUEGOS */
.game{
    display:flex;
    align-items:center;
    justify-content:left;
    margin:15px auto;
    width:600px;
    background:#151515;
    border-radius:10px;
    padding:10px;
    transition:.2s;
    text-decoration:none;
}

.game:hover{
    background:#1f1f1f;
}

.game img{
    width:220px;
    height:70px;
    object-fit:cover;
    border-radius:6px;
    margin-right:15px;
}

.game span{
    color:#eaeaea;
    font-size:20px;
}
</style>
</head>

<body>

<div class="container">

    <h1>Lista de Juegos</h1>

    <!-- SECCIÓN 1: JUEGOS DESCARGABLES -->
    <h2>Juegos para Descargar</h2>

    <a href="victoria.html" class="game">
        <img src="img/victoriasteam.jpg">
        <span>Victoria II</span>
    </a>

    <a href="ageofempires2.html" class="game">
        <img src="img/ageofempires2.jpg">
        <span>Age of empires 2</span>
    </a>

    <a href="fnaf.html" class="game">
        <img src="img/fnaf title.jpg">
        <span>Five Nights at Freddy's</span>
    </a>

    <a href="minecraft.html" class="game">
        <img src="img/minecraft.jpg">
        <span>Minecraft Launcher</span>
    </a>

    <!-- SECCIÓN 2: JUEGOS EN LÍNEA / FLASH -->
    <h2>Juegos Flash (Para jugar en la Web)</h2>

    <a href="fernanfloo.html" class="game">
        <img src="img/fernanfloo title.jpg">
        <span>Fernanfloo Rescatar a Curly</span>
    </a>

    <a href="alienhominid.html" class="game">
        <img src="img/alienhominid title.jpg">
        <span>Alien Hominid</span>
    </a>

</div>

</body>
</html>
